name: Automated PR Review

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "src/**"
      - "*.js"
      - "*.json"

jobs:
  playwright-review:
    runs-on: ubuntu-latest
    environment: pr-action
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true # Enables tracking comments
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for Node.js/JavaScript best practices.

            Please provide a comprehensive code review focusing on:
            - Code quality and maintainability
            - JavaScript/Node.js best practices
            - API design and structure
            - Error handling and edge cases
            - Performance considerations
            - Security implications
            - Test coverage (if applicable)

            Note: The PR branch is already checked out.

            Post detailed findings as PR comments. Include specific code suggestions, potential issues, and improvements.