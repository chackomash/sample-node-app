name: Claude Code PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  claude-review:
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: "sonnet"
          direct_prompt: |
            Review only the code changes from the provided commit(s). Do not review the entire project.

            For each issue found, use the following format:

            **Issue <Number> – <Short Title>**

            **File Name:** `<file path>`
            **Line Number(s):** `<line number(s)>`

            **Code Affected:**
            ```
            <changed code snippet>
            ```

            **Impact:** Briefly explain the risk (Security / Performance / Maintainability / Reliability / Scalability).
            **Priority:** Critical / High / Medium / Low

            **Suggested Fix:**
            ```
            <improved code>
            ```

            Rules:
            - Review only the changed code in the commit(s).
            - Include the exact file name and line number(s) for every issue.
            - Do not report duplicate issues.
            - Ignore formatting-only changes unless they affect functionality or readability.
            - If no issues are found, respond with: "No significant issues found in the reviewed commit(s)."
